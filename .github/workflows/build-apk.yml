name: Build ChutaXuta Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ChulaXuta_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f ChulaXuta_Android_Project.zip || {
            echo "ERRO: ChulaXuta_Android_Project.zip não existe na raiz do repositório."
            exit 1
          }
          unzip -t ChulaXuta_Android_Project.zip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q ChulaXuta_Android_Project.zip -d project

          PROJECT_DIR="$GITHUB_WORKSPACE/project/ChulaXuta_Android"
          test -f "$PROJECT_DIR/settings.gradle" || {
            echo "ERRO: settings.gradle não encontrado em $PROJECT_DIR"
            echo "Conteúdo extraído:"
            find project -maxdepth 5 -print
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto Android encontrado em: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || {
            echo "ERRO: APK não encontrada em $APK"
            find "$PROJECT_DIR/app/build" -maxdepth 8 -type f -print || true
            exit 1
          }
          mkdir -p output
          cp "$APK" output/ChutaXuta-v1.42-debug.apk
          ls -lh output/ChutaXuta-v1.42-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChutaXuta-v1.42-APK
          path: output/ChutaXuta-v1.42-debug.apk
          if-no-files-found: error
          retention-days: 30
