name: Build ChutaXuta Android APK v1.43

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ChulaXuta_Android/**'
      - 'ChulaXuta_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          # Opção preferida: projeto Android já está diretamente no repositório.
          if [ -f "$GITHUB_WORKSPACE/ChulaXuta_Android/settings.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/ChulaXuta_Android"

          # Compatibilidade: se só existir o ZIP Android, extrai-o.
          elif [ -f "$GITHUB_WORKSPACE/ChulaXuta_Android_Project.zip" ]; then
            rm -rf "$GITHUB_WORKSPACE/android_extract"
            mkdir -p "$GITHUB_WORKSPACE/android_extract"
            unzip -q "$GITHUB_WORKSPACE/ChulaXuta_Android_Project.zip" -d "$GITHUB_WORKSPACE/android_extract"

            if [ -f "$GITHUB_WORKSPACE/android_extract/ChulaXuta_Android/settings.gradle" ]; then
              PROJECT_DIR="$GITHUB_WORKSPACE/android_extract/ChulaXuta_Android"
            else
              echo "ERRO: O ZIP existe mas não contém ChulaXuta_Android/settings.gradle"
              find "$GITHUB_WORKSPACE/android_extract" -maxdepth 5 -print
              exit 1
            fi
          else
            echo "ERRO: Projeto Android não encontrado."
            echo "Esperado: ChulaXuta_Android/settings.gradle"
            echo "ou: ChulaXuta_Android_Project.zip"
            echo "Conteúdo da raiz:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -print | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto Android: $PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrada em $APK"
            find "$PROJECT_DIR/app/build" -maxdepth 8 -type f -print || true
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/ChutaXuta-v1.43-debug.apk
          ls -lh output/ChutaXuta-v1.43-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChutaXuta-v1.43-APK
          path: output/ChutaXuta-v1.43-debug.apk
          if-no-files-found: error
          retention-days: 30
