name: Build ChutaXuta Android APK v1.52

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ChulaXuta_Android/**'
      - 'ChulaXuta_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/ChulaXuta_Android/settings.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/ChulaXuta_Android"
          elif [ -f "$GITHUB_WORKSPACE/ChulaXuta_Android_Project.zip" ]; then
            rm -rf "$GITHUB_WORKSPACE/android_extract"
            mkdir -p "$GITHUB_WORKSPACE/android_extract"
            unzip -q "$GITHUB_WORKSPACE/ChulaXuta_Android_Project.zip" -d "$GITHUB_WORKSPACE/android_extract"
            PROJECT_DIR="$GITHUB_WORKSPACE/android_extract/ChulaXuta_Android"
          else
            echo "ERRO: Projeto Android não encontrado."
            exit 1
          fi
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Não usar android-actions/setup-android: no runner atual essa action
      # tenta instalar o pacote legado "tools" e falha.
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" | head -50
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "ERRO: Android SDK Platform 35 não está pré-instalada no runner."
            echo "Plataformas disponíveis:"
            ls -1 "$ANDROID_HOME/platforms" || true
            exit 1
          }

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p output
          cp "$APK" output/ChutaXuta-v1.52-debug.apk
          ls -lh output/ChutaXuta-v1.52-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChutaXuta-v1.52-APK
          path: output/ChutaXuta-v1.52-debug.apk
          if-no-files-found: error
          retention-days: 30
