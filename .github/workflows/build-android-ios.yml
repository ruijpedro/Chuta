name: Build ChutaXuta v1.52 Android + iOS Sideload

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -d /usr/local/lib/android/sdk/platforms/android-35
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd ChulaXuta_Android
          gradle --no-daemon assembleDebug
          mkdir -p ../dist-android
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" ../dist-android/ChutaXuta-v1.52.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChutaXuta-v1.52-Android-APK
          path: dist-android/ChutaXuta-v1.52.apk
          if-no-files-found: error

  ios-sideload:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd ChutaXuta_iOS
          xcodebuild \
            -project ChutaXuta.xcodeproj \
            -scheme ChutaXuta \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/ChutaXuta.app
          zip -qry ChutaXuta-v1.52-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ChutaXuta-v1.52-iOS-Sideload-IPA
          path: ChutaXuta_iOS/ChutaXuta-v1.52-unsigned.ipa
          if-no-files-found: error
