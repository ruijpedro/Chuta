plugins { id 'com.android.application' }

android {
    namespace 'com.rjp.chulaxuta'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rjp.chulaxuta'
        minSdk 23
        targetSdk 35
        versionCode 159
        versionName '1.59.0'
    }

    // Só ativa a assinatura Release quando os quatro parâmetros estão presentes.
    def signingPath = project.findProperty('chutaKeystorePath')
    def signingStorePassword = project.findProperty('chutaStorePassword')
    def signingAlias = project.findProperty('chutaKeyAlias')
    def signingKeyPassword = project.findProperty('chutaKeyPassword')
    if (signingPath && signingStorePassword && signingAlias && signingKeyPassword) {
        signingConfigs {
            release {
                storeFile file(signingPath)
                storePassword signingStorePassword.toString()
                keyAlias signingAlias.toString()
                keyPassword signingKeyPassword.toString()
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}
